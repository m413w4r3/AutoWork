[agents]
enabled = true
# Paseo remains the outer orchestrator when available. Allow a small number
# of Codex-native helpers without creating an uncontrolled second fleet.
max_concurrent_threads_per_session = 2
# Depth limit applies to Codex V1; Paseo child sessions are independent.
max_depth = 1
default_subagent_reasoning_effort = "medium"
