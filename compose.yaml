name: cti-bulletin

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cti_app}
      POSTGRES_USER: ${POSTGRES_USER:-cti_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [default, analysis-internal]

  postgres-test:
    profiles: ["integration-test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [default, analysis-internal]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks: [default, analysis-internal]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-cti-local}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${S3_BUCKET}"
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      API_BIND_HOST: ${API_BIND_HOST:-0.0.0.0}
      OPERATOR_API_TOKEN: ${OPERATOR_API_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-cti_app}:${POSTGRES_PASSWORD:-local-postgres-only}@postgres:5432/${POSTGRES_DB:-cti_app}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-local-minio-user}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-cti-local}
      S3_SECURE: "false"
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-1}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-300}
      JOB_BRIDGE_UI_RETRY_BASE_SECONDS: ${JOB_BRIDGE_UI_RETRY_BASE_SECONDS:-300}
      JOB_BRIDGE_UI_RETRY_MAX_SECONDS: ${JOB_BRIDGE_UI_RETRY_MAX_SECONDS:-1800}
      JOB_HEARTBEAT_TIMEOUT_SECONDS: ${JOB_HEARTBEAT_TIMEOUT_SECONDS:-120}
      JOB_RECOVERY_INTERVAL_SECONDS: ${JOB_RECOVERY_INTERVAL_SECONDS:-30}
      # Doit rester supérieur au délai maximal du fournisseur modèle : le worker
      # attend la réponse, puis parse, persiste et regroupe.
      JOB_ACTOR_TIME_LIMIT_SECONDS: ${JOB_ACTOR_TIME_LIMIT_SECONDS:-4500}
      PRODUCTION_SUBJECT_JITTER_MIN_SECONDS: ${PRODUCTION_SUBJECT_JITTER_MIN_SECONDS:-30}
      PRODUCTION_SUBJECT_JITTER_MAX_SECONDS: ${PRODUCTION_SUBJECT_JITTER_MAX_SECONDS:-90}
      PRODUCTION_MODEL_JITTER_MIN_SECONDS: ${PRODUCTION_MODEL_JITTER_MIN_SECONDS:-8}
      PRODUCTION_MODEL_JITTER_MAX_SECONDS: ${PRODUCTION_MODEL_JITTER_MAX_SECONDS:-20}
      PRODUCTION_COOLDOWN_EVERY_N_SUBJECTS: ${PRODUCTION_COOLDOWN_EVERY_N_SUBJECTS:-3}
      PRODUCTION_COOLDOWN_MIN_SECONDS: ${PRODUCTION_COOLDOWN_MIN_SECONDS:-600}
      PRODUCTION_COOLDOWN_MAX_SECONDS: ${PRODUCTION_COOLDOWN_MAX_SECONDS:-1200}
      PRODUCTION_RELEVANCE_CLASSIFIER_ENABLED: ${PRODUCTION_RELEVANCE_CLASSIFIER_ENABLED:-true}
      PRODUCTION_EDITORIAL_RESOURCE_SEARCH_ENABLED: ${PRODUCTION_EDITORIAL_RESOURCE_SEARCH_ENABLED:-false}
      DISCOVERY_BRIDGE_POLL_INTERVAL_SECONDS: ${DISCOVERY_BRIDGE_POLL_INTERVAL_SECONDS:-5}
      OPENAI_BRIDGE_BASE_URL: ${OPENAI_BRIDGE_BASE_URL:-http://host.docker.internal:8001/v1}
      OPENAI_BRIDGE_API_KEY: ${OPENAI_BRIDGE_API_KEY:-}
      OPENAI_BRIDGE_CONNECT_TIMEOUT_SECONDS: ${OPENAI_BRIDGE_CONNECT_TIMEOUT_SECONDS:-3}
      OPENAI_BRIDGE_CAPABILITIES_TIMEOUT_SECONDS: ${OPENAI_BRIDGE_CAPABILITIES_TIMEOUT_SECONDS:-2}
      OPENAI_BRIDGE_WAIT_TIMEOUT_SECONDS: ${OPENAI_BRIDGE_WAIT_TIMEOUT_SECONDS:-3600}
      OPENAI_BRIDGE_WAIT_TIMEOUT_RESEARCH_SECONDS: ${OPENAI_BRIDGE_WAIT_TIMEOUT_RESEARCH_SECONDS:-7200}
      OPENAI_BRIDGE_ARCHIVE_TIMEOUT_SECONDS: ${OPENAI_BRIDGE_ARCHIVE_TIMEOUT_SECONDS:-60}
      OPENAI_RESEARCH_MODEL: ${OPENAI_RESEARCH_MODEL:-chatgpt-web}
      OPENAI_STRUCTURED_MODEL: ${OPENAI_STRUCTURED_MODEL:-chatgpt-web}
      OPENAI_DRAFTING_MODEL: ${OPENAI_DRAFTING_MODEL:-chatgpt-web}
      OPENAI_CRITIC_MODEL: ${OPENAI_CRITIC_MODEL:-chatgpt-web}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://host.docker.internal:8080/v1}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-Qwen3-32B}
      QWEN_IS_EXTERNAL: ${QWEN_IS_EXTERNAL:-false}
      WEBAI_BASE_URL: ${WEBAI_BASE_URL:-http://web_ai:6969/v1}
      WEBAI_API_KEY: ${WEBAI_API_KEY:-}
      WEBAI_MODEL: ${WEBAI_MODEL:-gemini-3-flash}
      WEBAI_IS_EXTERNAL: ${WEBAI_IS_EXTERNAL:-true}
      MODEL_ROUTE_WEB_RESEARCH: ${MODEL_ROUTE_WEB_RESEARCH:-chatgpt_bridge}
      MODEL_ROUTE_BULK_EXTRACTION: ${MODEL_ROUTE_BULK_EXTRACTION:-chatgpt_bridge}
      MODEL_ROUTE_AMBIGUOUS_CLUSTERING: ${MODEL_ROUTE_AMBIGUOUS_CLUSTERING:-chatgpt_bridge}
      MODEL_ROUTE_STANDARD_DRAFT: ${MODEL_ROUTE_STANDARD_DRAFT:-chatgpt_bridge}
      MODEL_ROUTE_PREMIUM_SYNTHESIS: ${MODEL_ROUTE_PREMIUM_SYNTHESIS:-chatgpt_bridge}
      MODEL_ROUTE_EDITORIAL_ENRICHMENT: ${MODEL_ROUTE_EDITORIAL_ENRICHMENT:-chatgpt_bridge}
      MODEL_ROUTE_CRITIQUE: ${MODEL_ROUTE_CRITIQUE:-chatgpt_bridge}
      MODEL_ROUTE_DISCOVERY_MERGE: ${MODEL_ROUTE_DISCOVERY_MERGE:-chatgpt_bridge}
      MODEL_FORCE_ADAPTER: ${MODEL_FORCE_ADAPTER:-auto}
      MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-300}
      MODEL_REQUEST_TIMEOUT_RESEARCH_SECONDS: ${MODEL_REQUEST_TIMEOUT_RESEARCH_SECONDS:-900}
      MODEL_BACKGROUND_WAIT_TIMEOUT_SECONDS: ${MODEL_BACKGROUND_WAIT_TIMEOUT_SECONDS:-5400}
      MODEL_BACKGROUND_WAIT_TIMEOUT_RESEARCH_SECONDS: ${MODEL_BACKGROUND_WAIT_TIMEOUT_RESEARCH_SECONDS:-}
      MODEL_BACKGROUND_IDLE_TIMEOUT_SECONDS: ${MODEL_BACKGROUND_IDLE_TIMEOUT_SECONDS:-1200}
      MODEL_BACKGROUND_IDLE_TIMEOUT_RESEARCH_SECONDS: ${MODEL_BACKGROUND_IDLE_TIMEOUT_RESEARCH_SECONDS:-}
      CODE_VERSION: ${CODE_VERSION:-0.1.0}
      WORKER_CODE_VERSION: ${WORKER_CODE_VERSION:-0.1.0}
      MODEL_CONVERSATION_RETENTION_DAYS: ${MODEL_CONVERSATION_RETENTION_DAYS:-90}
      COLLECTION_MAX_REDIRECTS: ${COLLECTION_MAX_REDIRECTS:-5}
      COLLECTION_TIMEOUT_SECONDS: ${COLLECTION_TIMEOUT_SECONDS:-30}
      COLLECTION_MAX_DOWNLOAD_BYTES: ${COLLECTION_MAX_DOWNLOAD_BYTES:-10485760}
      COLLECTION_MAX_EXPANDED_BYTES: ${COLLECTION_MAX_EXPANDED_BYTES:-26214400}
      COLLECTION_MAX_DECOMPRESSION_RATIO: ${COLLECTION_MAX_DECOMPRESSION_RATIO:-20}
      COLLECTION_ALLOWED_DOMAINS: ${COLLECTION_ALLOWED_DOMAINS:-}
      COLLECTION_BLOCKED_DOMAINS: ${COLLECTION_BLOCKED_DOMAINS:-}
      COLLECTION_FETCH_LEASE_SECONDS: ${COLLECTION_FETCH_LEASE_SECONDS:-120}
      PDF_MAX_DOCUMENT_BYTES: ${PDF_MAX_DOCUMENT_BYTES:-26214400}
      PDF_MAX_PAGES: ${PDF_MAX_PAGES:-200}
      PDF_PARSE_TIMEOUT_SECONDS: ${PDF_PARSE_TIMEOUT_SECONDS:-15}
      PDF_MAX_TEXT_CHARS: ${PDF_MAX_TEXT_CHARS:-2000000}
      PDF_MAX_METADATA_LENGTH: ${PDF_MAX_METADATA_LENGTH:-16384}
      QWEN_CHUNK_MAX_CHARS: ${QWEN_CHUNK_MAX_CHARS:-12000}
      QWEN_CHUNK_OVERLAP_CHARS: ${QWEN_CHUNK_OVERLAP_CHARS:-500}
      SUBJECT_WORKSPACE_ROOT: /work/subjects
      EDITION_WORKSPACE_ROOT: /work/editions
      GOODWARE_CACHE_ROOT: ${GOODWARE_CACHE_ROOT:-/var/cache/autowork/goodware}
      PDF_INSPECTION_CACHE_ROOT: ${PDF_INSPECTION_CACHE_ROOT:-/var/cache/autowork/pdf-inspections}
      DIAGNOSTICS_LOG_ROOT: ${DIAGNOSTICS_LOG_ROOT:-/var/diagnostics}
      VIRUSTOTAL_FILE_REPORT_ENABLED: ${VIRUSTOTAL_FILE_REPORT_ENABLED:-false}
      VIRUSTOTAL_OBJECT_RELATIONSHIPS_ENABLED: ${VIRUSTOTAL_OBJECT_RELATIONSHIPS_ENABLED:-false}
      VIRUSTOTAL_INTELLIGENCE_SEARCH_ENABLED: ${VIRUSTOTAL_INTELLIGENCE_SEARCH_ENABLED:-false}
      VIRUSTOTAL_BEHAVIOUR_REPORTS_ENABLED: ${VIRUSTOTAL_BEHAVIOUR_REPORTS_ENABLED:-false}
      VIRUSTOTAL_FILE_DOWNLOAD_ENABLED: ${VIRUSTOTAL_FILE_DOWNLOAD_ENABLED:-false}
      VIRUSTOTAL_RETROHUNT_ENABLED: ${VIRUSTOTAL_RETROHUNT_ENABLED:-false}
      VIRUSTOTAL_RETROHUNT_MAX_RESULT_PAGES: ${VIRUSTOTAL_RETROHUNT_MAX_RESULT_PAGES:-20}
      VIRUSTOTAL_RETROHUNT_MAX_RESULTS: ${VIRUSTOTAL_RETROHUNT_MAX_RESULTS:-1000}
      VIRUSTOTAL_PROXY_URL: ${VIRUSTOTAL_PROXY_URL:-}
      VIRUSTOTAL_BASE_URL: ${VIRUSTOTAL_BASE_URL:-http://www.virustotal.com/api/v3}
      VIRUSTOTAL_FALLBACK_BASE_URL: ${VIRUSTOTAL_FALLBACK_BASE_URL:-https://www.virustotal.com/api/v3}
      VIRUSTOTAL_LEGACY_BASE_URL: ${VIRUSTOTAL_LEGACY_BASE_URL:-http://www.virustotal.com/vtapi/v2}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      VIRUSTOTAL_FILE_REPORT_PROXY_FALLBACK_ENABLED: ${VIRUSTOTAL_FILE_REPORT_PROXY_FALLBACK_ENABLED:-false}
      VIRUSTOTAL_FILE_REPORT_LEGACY_FALLBACK_ENABLED: ${VIRUSTOTAL_FILE_REPORT_LEGACY_FALLBACK_ENABLED:-false}
      VIRUSTOTAL_PROXY_INSECURE: ${VIRUSTOTAL_PROXY_INSECURE:-false}
      VIRUSTOTAL_CONNECT_TIMEOUT_SECONDS: ${VIRUSTOTAL_CONNECT_TIMEOUT_SECONDS:-5}
      VIRUSTOTAL_READ_TIMEOUT_SECONDS: ${VIRUSTOTAL_READ_TIMEOUT_SECONDS:-60}
      VIRUSTOTAL_MAX_RESPONSE_BYTES: ${VIRUSTOTAL_MAX_RESPONSE_BYTES:-10485760}
      VIRUSTOTAL_DEFAULT_PAGE_SIZE: ${VIRUSTOTAL_DEFAULT_PAGE_SIZE:-40}
      VIRUSTOTAL_MAX_PAGE_SIZE: ${VIRUSTOTAL_MAX_PAGE_SIZE:-100}
      VIRUSTOTAL_MAX_PAGES: ${VIRUSTOTAL_MAX_PAGES:-10}
      VIRUSTOTAL_MAX_RESULTS: ${VIRUSTOTAL_MAX_RESULTS:-1000}
      VIRUSTOTAL_DOWNLOAD_MAX_BYTES: ${VIRUSTOTAL_DOWNLOAD_MAX_BYTES:-209715200}
      VIRUSTOTAL_DOWNLOAD_TIMEOUT_SECONDS: ${VIRUSTOTAL_DOWNLOAD_TIMEOUT_SECONDS:-120}
      VIRUSTOTAL_DOWNLOAD_ALLOWED_HOSTS: ${VIRUSTOTAL_DOWNLOAD_ALLOWED_HOSTS:-}
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      SHODAN_HOST_ENABLED: ${SHODAN_HOST_ENABLED:-false}
      SHODAN_SEARCH_ENABLED: ${SHODAN_SEARCH_ENABLED:-false}
      SHODAN_DOMAIN_ENABLED: ${SHODAN_DOMAIN_ENABLED:-false}
      SHODAN_COUNT_ENABLED: ${SHODAN_COUNT_ENABLED:-false}
      SHODAN_BASE_URL: ${SHODAN_BASE_URL:-https://api.shodan.io}
      SHODAN_CONNECT_TIMEOUT_SECONDS: ${SHODAN_CONNECT_TIMEOUT_SECONDS:-5}
      SHODAN_READ_TIMEOUT_SECONDS: ${SHODAN_READ_TIMEOUT_SECONDS:-30}
      SHODAN_MAX_RESPONSE_BYTES: ${SHODAN_MAX_RESPONSE_BYTES:-10485760}
      SHODAN_MAX_PAGES: ${SHODAN_MAX_PAGES:-10}
      SHODAN_MAX_RESULTS: ${SHODAN_MAX_RESULTS:-1000}
      INVESTIGATION_MAX_CYCLES: ${INVESTIGATION_MAX_CYCLES:-12}
      INVESTIGATION_MAX_PIVOT_RUNS: ${INVESTIGATION_MAX_PIVOT_RUNS:-0}
      INVESTIGATION_MAX_HITS_ACQUIRED: ${INVESTIGATION_MAX_HITS_ACQUIRED:-0}
      INVESTIGATION_MAX_NEW_SAMPLES: ${INVESTIGATION_MAX_NEW_SAMPLES:-0}
      INVESTIGATION_MAX_VT_READ_UNITS: ${INVESTIGATION_MAX_VT_READ_UNITS:-0}
      INVESTIGATION_MAX_SHODAN_CREDITS: ${INVESTIGATION_MAX_SHODAN_CREDITS:-0}
      INVESTIGATION_MAX_TOOL_SECONDS: ${INVESTIGATION_MAX_TOOL_SECONDS:-3600}
      INVESTIGATION_MAX_CONTEXT_BYTES: ${INVESTIGATION_MAX_CONTEXT_BYTES:-4000000}
      INVESTIGATION_NO_PROGRESS_LIMIT: ${INVESTIGATION_NO_PROGRESS_LIMIT:-3}
      LOCAL_ANALYSIS_ENABLED: ${LOCAL_ANALYSIS_ENABLED:-false}
      LOCAL_ANALYSIS_REQUIRE_FILESYSTEM_CONFINEMENT: ${LOCAL_ANALYSIS_REQUIRE_FILESYSTEM_CONFINEMENT:-true}
      LOCAL_ANALYSIS_TIMEOUT_SECONDS: ${LOCAL_ANALYSIS_TIMEOUT_SECONDS:-30}
      LOCAL_ANALYSIS_MAX_OUTPUT_BYTES: ${LOCAL_ANALYSIS_MAX_OUTPUT_BYTES:-1000000}
      LOCAL_ANALYSIS_CPU_LIMIT_SECONDS: ${LOCAL_ANALYSIS_CPU_LIMIT_SECONDS:-30}
      LOCAL_ANALYSIS_MEMORY_LIMIT_BYTES: ${LOCAL_ANALYSIS_MEMORY_LIMIT_BYTES:-536870912}
      LOCAL_ANALYSIS_FILE_SIZE_LIMIT_BYTES: ${LOCAL_ANALYSIS_FILE_SIZE_LIMIT_BYTES:-1048576}
      LOCAL_ANALYSIS_MAX_SAMPLE_BYTES: ${LOCAL_ANALYSIS_MAX_SAMPLE_BYTES:-209715200}
      ANALYSIS_WORKER_ENABLED: ${ANALYSIS_WORKER_ENABLED:-false}
      ANALYSIS_WORKER_PROBE_TIMEOUT_SECONDS: ${ANALYSIS_WORKER_PROBE_TIMEOUT_SECONDS:-8}
      ANALYSIS_WORKER_JOB_TIMEOUT_SECONDS: ${ANALYSIS_WORKER_JOB_TIMEOUT_SECONDS:-120}
      ANALYSIS_WORKER_POLL_INTERVAL_SECONDS: ${ANALYSIS_WORKER_POLL_INTERVAL_SECONDS:-0.25}
      ANALYSIS_WORKER_RESULT_MAX_BYTES: ${ANALYSIS_WORKER_RESULT_MAX_BYTES:-1000000}
      ANALYSIS_WORKER_EXPECTED_ISOLATION_PROFILE: ${ANALYSIS_WORKER_EXPECTED_ISOLATION_PROFILE:-bookworm-internal-v1}
      ANALYSIS_STRING_MIN_LENGTH: ${ANALYSIS_STRING_MIN_LENGTH:-4}
      ANALYSIS_MAX_STRINGS: ${ANALYSIS_MAX_STRINGS:-10000}
      ANALYSIS_MAX_SAMPLE_BYTES: ${ANALYSIS_MAX_SAMPLE_BYTES:-209715200}
      ANALYSIS_CAPA_RULES_PATH: /app/rules/capa
      ANALYSIS_CAPA_EXPECTED_VERSION: ${ANALYSIS_CAPA_EXPECTED_VERSION:-9.4.0}
      ANALYSIS_SMDA_EXPECTED_VERSION: ${ANALYSIS_SMDA_EXPECTED_VERSION:-4.5.0}
      ANALYSIS_CAPA_RULESET_REVISION: ${ANALYSIS_CAPA_RULESET_REVISION:-2af9fbfc1c9b4634dbeb76b5d34fca9389fa7f80}
      ANALYSIS_TSHARK_EXPECTED_VERSION: ${ANALYSIS_TSHARK_EXPECTED_VERSION:-4.0.17}
      ANALYSIS_CAPINFOS_EXPECTED_VERSION: ${ANALYSIS_CAPINFOS_EXPECTED_VERSION:-4.0.17}
      ANALYSIS_CAPA_TIMEOUT_SECONDS: ${ANALYSIS_CAPA_TIMEOUT_SECONDS:-60}
      ANALYSIS_CAPA_MAX_OUTPUT_BYTES: ${ANALYSIS_CAPA_MAX_OUTPUT_BYTES:-10485760}
      ANALYSIS_CAPA_MAX_MEMORY_BYTES: ${ANALYSIS_CAPA_MAX_MEMORY_BYTES:-536870912}
      SMDA_TIMEOUT_SECONDS: ${SMDA_TIMEOUT_SECONDS:-120}
      SMDA_MAX_OUTPUT_BYTES: ${SMDA_MAX_OUTPUT_BYTES:-33554432}
      SMDA_MAX_MEMORY_BYTES: ${SMDA_MAX_MEMORY_BYTES:-1073741824}
      RULE_WORKBENCH_ENABLED: ${RULE_WORKBENCH_ENABLED:-false}
      MWCP_PARSER_VERSIONS: ${MWCP_PARSER_VERSIONS:-{}}
      GHIDRA_ENABLED: ${GHIDRA_ENABLED:-false}
      GHIDRA_BASE_URL: ${GHIDRA_BASE_URL:-http://ghidra:8787}
      GHIDRA_CONNECT_TIMEOUT_SECONDS: ${GHIDRA_CONNECT_TIMEOUT_SECONDS:-3}
      GHIDRA_READ_TIMEOUT_SECONDS: ${GHIDRA_READ_TIMEOUT_SECONDS:-150}
      GHIDRA_MAX_SAMPLE_BYTES: ${GHIDRA_MAX_SAMPLE_BYTES:-209715200}
      GHIDRA_MAX_RESPONSE_BYTES: ${GHIDRA_MAX_RESPONSE_BYTES:-2097152}
      GHIDRA_EXPECTED_VERSION: ${GHIDRA_EXPECTED_VERSION:-12.1.4}
      GHIDRA_EXPECTED_JAVA_VERSION: ${GHIDRA_EXPECTED_JAVA_VERSION:-21.0.12.1}
      NATIVE_ANALYSIS_ENABLED: ${NATIVE_ANALYSIS_ENABLED:-false}
      NATIVE_ANALYSIS_PROVIDER: ${NATIVE_ANALYSIS_PROVIDER:-none}
      NATIVE_ANALYSIS_CATALOG_VERSION: ${NATIVE_ANALYSIS_CATALOG_VERSION:-autowork-native-read.v1}
      NATIVE_ANALYSIS_REA_EXPECTED_VERSION: ${NATIVE_ANALYSIS_REA_EXPECTED_VERSION:-}
      NATIVE_ANALYSIS_TIMEOUT_SECONDS: ${NATIVE_ANALYSIS_TIMEOUT_SECONDS:-150}
      NATIVE_ANALYSIS_MAX_RESPONSE_BYTES: ${NATIVE_ANALYSIS_MAX_RESPONSE_BYTES:-65536}
      NATIVE_ANALYSIS_MAX_OUTPUT_BYTES: ${NATIVE_ANALYSIS_MAX_OUTPUT_BYTES:-32768}
    volumes:
      - ./var/workspaces/subjects:/work/subjects
      - ./var/workspaces/editions:/work/editions
      - goodware_cache:/var/cache/autowork/goodware
      - ./var/diagnostics:/var/diagnostics
      - ./var/pdf-inspections:/var/cache/autowork/pdf-inspections
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The exact readiness route is deliberately reachable without a bearer token.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    networks: [default, analysis-internal]

  migrate:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      OPERATOR_API_TOKEN: null
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command:
      [
        "dramatiq",
        "cti_app.workers.tasks",
        "--processes",
        "1",
        "--threads",
        "2",
        "--skip-logging",
      ]
    environment:
      <<: *backend-environment
    volumes:
      - ./var/workspaces/subjects:/work/subjects
      - ./var/workspaces/editions:/work/editions
      - goodware_cache:/var/cache/autowork/goodware
      - ./var/diagnostics:/var/diagnostics
      - ./var/pdf-inspections:/var/cache/autowork/pdf-inspections
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import redis; redis.Redis(host='redis', port=6379).ping()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

    networks: [default, analysis-internal]

  job-recovery:
    build:
      context: .
      dockerfile: infra/backend.Dockerfile
    command: ["python", "-m", "cti_app.workers.scheduler"]
    environment:
      <<: *backend-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import redis; redis.Redis(host='redis', port=6379).ping()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  analysis-worker:
    build:
      context: .
      dockerfile: infra/analysis-worker.Dockerfile
    command:
      [
        "dramatiq",
        "cti_app.workers.analysis_tasks",
        "--processes",
        "1",
        "--threads",
        "1",
        "--queues",
        "analysis",
        "analysis-probe",
      ]
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    pids_limit: 128
    cpus: 2.0
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-cti_app}:${POSTGRES_PASSWORD:-local-postgres-only}@postgres:5432/${POSTGRES_DB:-cti_app}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-local-minio-user}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-password}
      S3_BUCKET: ${S3_BUCKET:-cti-local}
      S3_SECURE: "false"
      JOB_RETRY_BASE_SECONDS: ${JOB_RETRY_BASE_SECONDS:-1}
      JOB_RETRY_MAX_SECONDS: ${JOB_RETRY_MAX_SECONDS:-300}
      JOB_BRIDGE_UI_RETRY_BASE_SECONDS: ${JOB_BRIDGE_UI_RETRY_BASE_SECONDS:-300}
      JOB_BRIDGE_UI_RETRY_MAX_SECONDS: ${JOB_BRIDGE_UI_RETRY_MAX_SECONDS:-1800}
      JOB_HEARTBEAT_TIMEOUT_SECONDS: ${JOB_HEARTBEAT_TIMEOUT_SECONDS:-120}
      JOB_RECOVERY_INTERVAL_SECONDS: ${JOB_RECOVERY_INTERVAL_SECONDS:-30}
      JOB_ACTOR_TIME_LIMIT_SECONDS: ${JOB_ACTOR_TIME_LIMIT_SECONDS:-4500}
      ANALYSIS_STRING_MIN_LENGTH: ${ANALYSIS_STRING_MIN_LENGTH:-4}
      ANALYSIS_MAX_STRINGS: ${ANALYSIS_MAX_STRINGS:-10000}
      ANALYSIS_MAX_SAMPLE_BYTES: ${ANALYSIS_MAX_SAMPLE_BYTES:-209715200}
      ANALYSIS_CAPA_RULES_PATH: /app/rules/capa
      ANALYSIS_WORKER_ENABLED: ${ANALYSIS_WORKER_ENABLED:-false}
      ANALYSIS_WORKER_ISOLATION_PROFILE: ${ANALYSIS_WORKER_ISOLATION_PROFILE:-bookworm-internal-v1}
      ANALYSIS_WORKER_JOB_TIMEOUT_SECONDS: ${ANALYSIS_WORKER_JOB_TIMEOUT_SECONDS:-120}
      ANALYSIS_WORKER_RESULT_MAX_BYTES: ${ANALYSIS_WORKER_RESULT_MAX_BYTES:-1000000}
      ANALYSIS_CAPA_EXPECTED_VERSION: ${ANALYSIS_CAPA_EXPECTED_VERSION:-9.4.0}
      ANALYSIS_SMDA_EXPECTED_VERSION: ${ANALYSIS_SMDA_EXPECTED_VERSION:-4.5.0}
      ANALYSIS_CAPA_RULESET_REVISION: ${ANALYSIS_CAPA_RULESET_REVISION:-2af9fbfc1c9b4634dbeb76b5d34fca9389fa7f80}
      ANALYSIS_TSHARK_EXPECTED_VERSION: ${ANALYSIS_TSHARK_EXPECTED_VERSION:-4.0.17}
      ANALYSIS_CAPINFOS_EXPECTED_VERSION: ${ANALYSIS_CAPINFOS_EXPECTED_VERSION:-4.0.17}
      ANALYSIS_CAPA_TIMEOUT_SECONDS: ${ANALYSIS_CAPA_TIMEOUT_SECONDS:-60}
      ANALYSIS_CAPA_MAX_OUTPUT_BYTES: ${ANALYSIS_CAPA_MAX_OUTPUT_BYTES:-10485760}
      ANALYSIS_CAPA_MAX_MEMORY_BYTES: ${ANALYSIS_CAPA_MAX_MEMORY_BYTES:-536870912}
      SMDA_TIMEOUT_SECONDS: ${SMDA_TIMEOUT_SECONDS:-120}
      SMDA_MAX_OUTPUT_BYTES: ${SMDA_MAX_OUTPUT_BYTES:-33554432}
      SMDA_MAX_MEMORY_BYTES: ${SMDA_MAX_MEMORY_BYTES:-1073741824}
      MWCP_PARSER_VERSIONS: ${MWCP_PARSER_VERSIONS:-{}}
      GOODWARE_CACHE_ROOT: ${GOODWARE_CACHE_ROOT:-/var/cache/autowork/goodware}
      GHIDRA_ENABLED: ${GHIDRA_ENABLED:-false}
      GHIDRA_BASE_URL: ${GHIDRA_BASE_URL:-http://ghidra:8787}
      GHIDRA_CONNECT_TIMEOUT_SECONDS: ${GHIDRA_CONNECT_TIMEOUT_SECONDS:-3}
      GHIDRA_READ_TIMEOUT_SECONDS: ${GHIDRA_READ_TIMEOUT_SECONDS:-150}
      GHIDRA_MAX_SAMPLE_BYTES: ${GHIDRA_MAX_SAMPLE_BYTES:-209715200}
      GHIDRA_MAX_RESPONSE_BYTES: ${GHIDRA_MAX_RESPONSE_BYTES:-2097152}
      GHIDRA_EXPECTED_VERSION: ${GHIDRA_EXPECTED_VERSION:-12.1.4}
      GHIDRA_EXPECTED_JAVA_VERSION: ${GHIDRA_EXPECTED_JAVA_VERSION:-21.0.12.1}
    volumes:
      - goodware_cache:/var/cache/autowork/goodware
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    networks: [analysis-internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, redis; assert os.getuid() == 10001; redis.Redis.from_url(os.environ['REDIS_URL']).ping()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  ghidra:
    profiles: [ghidra]
    platform: linux/amd64
    build:
      context: .
      dockerfile: infra/ghidra.Dockerfile
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10002,gid=10002,mode=1777
      - /work:rw,noexec,nosuid,nodev,size=2g,uid=10002,gid=10002,mode=0700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 6g
    pids_limit: 192
    cpus: 2.0
    environment:
      GHIDRA_INSTALL_DIR: /opt/ghidra
      GHIDRA_SERVICE_BIND: 0.0.0.0
      GHIDRA_SERVICE_PORT: 8787
      GHIDRA_EXPECTED_VERSION: ${GHIDRA_EXPECTED_VERSION:-12.1.4}
      GHIDRA_EXPECTED_JAVA_VERSION: ${GHIDRA_EXPECTED_JAVA_VERSION:-21.0.12.1}
      GHIDRA_MAX_SAMPLE_BYTES: ${GHIDRA_MAX_SAMPLE_BYTES:-209715200}
      GHIDRA_SERVICE_JOB_TIMEOUT_SECONDS: ${GHIDRA_SERVICE_JOB_TIMEOUT_SECONDS:-120}
      GHIDRA_WORKSPACE: /work
      HOME: /work/home
      XDG_CONFIG_HOME: /work/home/.config
      XDG_CACHE_HOME: /work/home/.cache
      JAVA_HOME: /opt/java/openjdk
      PATH: /opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      TMPDIR: /work/home/tmp
    networks: [analysis-internal]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/v1/probe', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  goodware_cache:

networks:
  analysis-internal:
    internal: true
