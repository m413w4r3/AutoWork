name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_ADMIN_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppler, TShark and bubblewrap for render and network workbench tests
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends --yes \
            poppler-utils tshark bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces; the confined analysis
          # runner needs them for the filesystem confinement of tshark/capinfos.
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v pdftoppm
          command -v pdftotext
          command -v pdfinfo
          command -v tshark
          command -v capinfos
          command -v bwrap
      - name: Install pinned D2 for diagram compilation tests
        run: |
          ../scripts/install-d2.sh "$RUNNER_TEMP/d2"
          echo "$RUNNER_TEMP/d2" >> "$GITHUB_PATH"
          echo "D2_BINARY=$RUNNER_TEMP/d2/d2" >> "$GITHUB_ENV"
      - name: Install pinned Typst for publication render tests
        run: |
          ../scripts/install-typst.sh "$RUNNER_TEMP/typst"
          echo "$RUNNER_TEMP/typst" >> "$GITHUB_PATH"
          echo "TYPST_BINARY=$RUNNER_TEMP/typst/typst" >> "$GITHUB_ENV"
      - name: Install pinned Typst fonts for publication render tests
        run: |
          ../scripts/install-typst-fonts.sh "$RUNNER_TEMP/typst-fonts"
          echo "FONT_BUNDLE_ROOT=$RUNNER_TEMP/typst-fonts" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -m "not workflow_fast and not workflow_full"
      - name: Workflow emulator — FAST gate
        if: always()
        run: make -C .. test-workflow
      # Run only workflow_full here; FAST already ran above, avoiding duplicates.
      # workflow_full collects W1, W5, W7, W9, W11 and W12, so the FULL-only floor is 6.
      # Keep FULL in this job so it reuses Typst, fonts, D2, PostgreSQL and uv.
      # A separate job would reinstall those tools; this trades a longer backend
      # job for avoiding duplicate setup and keeps FAST and FULL independently visible.
      - name: Workflow emulator — FULL gate
        if: always()
        run: |
          results="$GITHUB_WORKSPACE/var/workflow-results/full-only"
          rm -rf -- "$results"
          mkdir -p "$results/traces"
          if WORKFLOW_EMULATOR_REQUIRED=1 \
            WORKFLOW_TRACE_DIR="$results/traces" \
            make -C .. test-integration \
              INTEGRATION_TEST_PATH=tests/workflow_emulator \
              INTEGRATION_PYTEST_ARGS="-m workflow_full --durations=0 -o xfail_strict=true --junitxml=../var/workflow-results/full-only/junit.xml"; then
            pytest_status=0
          else
            pytest_status=$?
          fi
          if cd .. && cd backend && env -u UV_NO_SYNC -u UV_NO_DEFAULT_GROUPS -u UV_NO_DEV -u UV_NO_GROUP -u UV_FROZEN \
            uv run --no-sync --python 3.12 -- python -I ../scripts/ci/check_workflow_results.py \
              --junitxml "$results/junit.xml" \
              --expression workflow_full \
              --min-count 6 \
              --uv uv; then
            guard_status=0
          else
            guard_status=$?
          fi
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          exit "$guard_status"
      - name: Upload workflow emulator evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-emulator-evidence
          path: var/workflow-results/
          if-no-files-found: warn
          retention-days: 3

  typst-renderer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image with pinned Typst fonts
        run: docker build -f infra/backend.Dockerfile -t autowork-backend-smoke .
      - name: backend image does not contain pandoc
        run: docker run --rm --entrypoint sh autowork-backend-smoke -c '! command -v pandoc'
      - name: Compile the production renderer with bundled fonts and no network
        run: |
          docker run --rm --network none autowork-backend-smoke sh -eu -c '
            typst --version
            command -v pdftoppm pdfinfo pdffonts
            test -s /app/chpTypst/RENDERER/publication.typ
            test -s /app/chpTypst/UTILS/chap.png
            python3 -c "import json,pathlib,sys; root=pathlib.Path(\"/usr/local/share/autowork/typst-fonts\"); files=json.loads(pathlib.Path(\"/usr/local/share/autowork/typst-fonts.lock\").read_text())[\"files\"]; missing=[name for name in files if not (root/name).is_file() or (root/name).stat().st_size == 0]; print(\"missing or empty manifest fonts:\", missing) if missing else None; sys.exit(bool(missing))"
            workspace=$(mktemp -d)
            trap "rm -rf $workspace" EXIT
            mkdir -p "$workspace/RENDERER" "$workspace/UTILS"
            cp -R /app/chpTypst/RENDERER/. "$workspace/RENDERER/"
            cp -R /app/chpTypst/UTILS/. "$workspace/UTILS/"
            test -s "$workspace/UTILS/chap.png"
            cat > "$workspace/RENDERER/render-data.json" <<EOF
          {"schema_version":"typst-publication-model-v24-canonical-investigation-figures","language":"fr","title":"Font bundle smoke","document_label":"AutoWork font bundle smoke","content_sections":[{"type":"references","timeline":[],"blocks":[],"sources":[]},{"type":"synthesis","blocks":[{"type":"paragraph","text":"Bundled font compile smoke."}]}]}
          EOF
            typst compile --root "$workspace" \
              --font-path /usr/local/share/autowork/typst-fonts/HankenGrotesk \
              --font-path /usr/local/share/autowork/typst-fonts/CascadiaCode/ttf \
              --ignore-system-fonts --creation-timestamp 0 \
              "$workspace/RENDERER/publication.typ" "$workspace/output.pdf"
            test -s "$workspace/output.pdf"
            python /app/scripts/typst_edition_smoke.py
          '

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test --run
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  workflow-browser:
    name: Workflow W10 + J2 — browser with real PostgreSQL backend
    runs-on: ubuntu-latest
    env:
      TEST_POSTGRES_ADMIN_DSN: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Poppler for the J2 release PDF check
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes poppler-utils
      - name: Install Typst 0.15.1 for the J2 release PDF
        uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - name: Install pinned Typst font bundle for J2
        run: |
          ./scripts/install-typst-fonts.sh "$RUNNER_TEMP/typst-fonts"
          echo "FONT_BUNDLE_ROOT=$RUNNER_TEMP/typst-fonts" >> "$GITHUB_ENV"
      - name: Workflow W10 — real-backend browser exclusion
        run: make test-workflow-browser
      - name: Workflow J2 — investigation, human repin and real PDF
        run: make test-workflow-browser-investigation
      - name: Upload W10/J2 browser report and trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-browser-evidence
          path: |
            var/workflow-results/browser/
            var/workflow-results/browser-investigation/
          if-no-files-found: warn
          retention-days: 3

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
