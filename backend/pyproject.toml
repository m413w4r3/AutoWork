[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cti-app"
version = "0.1.0"
description = "Technical foundation for the monthly CTI bulletin application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "dramatiq[redis]>=1.18,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "minio>=7.2,<8",
  "pypdf>=5.9,<7",
  "pydantic-settings>=2.10,<3",
  "redis>=6.4,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
analysis = [
  "flare-capa==9.4.0",
  "pefile==2024.8.26",
  "pyelftools==0.33",
  "ppdeep==20260221",
  "py-tlsh==5.0.0",
  "smda==4.5.0",
]
dev = [
  "aiosqlite>=0.20,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cti_app"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requires a temporary PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Prompt templates are verbatim model input: wrapping them would inject
# newlines into the prompts themselves.
"src/cti_app/application/production_prompts.py" = ["E501"]
# Migrations 0005–0010 are validated immutable history.
# Keep their historical formatting unchanged.
"migrations/versions/*.py" = ["E501", "I001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers are evaluated once at import time and reused by
# design; that's the framework's contract, not the mutable-default-argument
# bug B008 looks for. Ruff already treats these as immutable when the
# parameter's own type annotation is immutable (e.g. `str`); this extends the
# same treatment to annotations B008 doesn't otherwise recognize (e.g. `UUID`).
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cti_app"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "minio.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "tests",
  "tests.*",
  "test_invariants",
  "test_code_features",
  "test_smda_adapter",
  "test_invariant_proposals",
  "test_capabilities",
  "test_static_analysis",
  "integration.test_invariant_registry_concurrency",
]
check_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_untyped_defs = false
warn_unused_ignores = false
disable_error_code = [
  "arg-type",
  "attr-defined",
  "assignment",
  "comparison-overlap",
  "import-untyped",
  "index",
  "union-attr",
  "var-annotated",
  "no-untyped-def",
]
